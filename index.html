<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Отдельной главной нет: корень ведёт на политику Grace. GitHub Pages не умеет
     настоящую переадресацию сервером, поэтому — meta refresh и скрипт, который
     сохраняет ?lang= из адреса. -->
<meta http-equiv="refresh" content="0; url=grace/privacy/">
<link rel="canonical" href="https://redwood-apps.github.io/grace/privacy/">
<meta name="robots" content="noindex">
<title>Grace — Privacy Policy</title>
<script>location.replace('grace/privacy/' + location.search);</script>
</head>
<body>
<p><a href="grace/privacy/">Grace — Privacy Policy</a></p>
</body>
</html>
